# TRAFS-Fish zero-training Gate and frozen pilot configuration.
metadata_path: outputs/gate0/audit/f4k_metadata.csv
track_split_path: splits/f4k16t_track_level_dev.csv
outer_folds_path: splits/f4k16t_outer_3fold.json
base_checkpoint: outputs/cxt_fish/phase1a_replication/A1_s1_ce_seed3407/best.pt
image_size: 224
batch_size: 64
epochs: 40
early_stopping_patience: 7
